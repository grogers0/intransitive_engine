[workspace]
members = [
    "analyzer",
    "base",
    "rpsi_bot",
    "search",
    "tablebase",
]
resolver = "3"

[profile.release-debug]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
base = { path = "base" }
search = { path = "search" }
rand = "0.10"
rayon = "1.12"
