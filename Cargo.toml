[workspace]
members = [
    "analyzer",
    "base",
    "rpsi_bot",
    "search",
]
resolver = "3"

[profile.release-debug]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
base = { path = "base" }
search = { path = "search" }
rand = "0.10"
num_cpus = "1"
