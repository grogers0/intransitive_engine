[workspace]
members = [
    "analyzer",
    "base",
    "rpsi_bot",
    "search",
    "tablebase",
]
resolver = "3"

[profile.release]
lto = "thin"

[profile.release-debug]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
base = { path = "base" }
memmap2 = "0.9"
rand = "0.10"
rayon = "1.12"
search = { path = "search" }
tablebase = { path = "tablebase" }
